dataset: cicids
data_root: ./data
target_col: Label
split:
  test_size: 0.20
  val_size: 0.20
  random_state: 42
models:
  xgb:
    n_estimators: 500
    max_depth: 8
    learning_rate: 0.1
  lgbm:
    n_estimators: 800
    learning_rate: 0.05
  cat:
    iterations: 800
    depth: 8
    learning_rate: 0.1
